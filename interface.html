<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sexta-Feira v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020609;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }

    .sf-root {
      width: 900px;
      min-height: 680px;
      display: grid;
      grid-template-columns: 150px 1fr 150px;
      grid-template-rows: auto 1fr auto;
      position: relative;
      border: 1px solid #0a2a40;
    }

    /* Scanlines */
    .sf-scanline {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,180,255,0.007) 3px, rgba(0,180,255,0.007) 4px);
      pointer-events: none; z-index: 0;
    }

    /* Corner brackets */
    .sf-corners { position: absolute; inset: -1px; z-index: 3; pointer-events: none; }
    .sf-corners span {
      position: absolute; width: 20px; height: 20px;
      border-color: #1a5a8a; border-style: solid; border-width: 0;
    }
    .sf-corners span.tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .sf-corners span.tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .sf-corners span.bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .sf-corners span.br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    /* Header */
    .sf-header {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px 12px;
      border-bottom: 1px solid #0a2a40;
      z-index: 2;
    }
    .sf-clock-time {
      font-family: 'Orbitron', monospace;
      font-size: 22px; font-weight: 700; letter-spacing: .12em; color: #3ab8ff;
    }
    .sf-clock-date {
      font-size: 8px; letter-spacing: .22em; color: #0e3a58;
      text-transform: uppercase; margin-top: 4px;
    }
    .sf-title-block { text-align: center; }
    .sf-title {
      font-family: 'Orbitron', monospace;
      font-size: 14px; font-weight: 900; letter-spacing: .55em;
      color: #2a7ab8; text-transform: uppercase;
    }
    .sf-subtitle {
      font-size: 7px; letter-spacing: .3em; color: #0e3a58;
      text-transform: uppercase; margin-top: 5px;
    }
    .sf-sys-row {
      font-size: 7px; letter-spacing: .16em; color: #0e3a58;
      text-transform: uppercase; line-height: 2.1; text-align: right;
    }
    .sf-sys-val { color: #1a6aaa; }

    /* HUD panels */
    .sf-hud-left {
      grid-column: 1; grid-row: 2;
      display: flex; flex-direction: column; gap: 14px;
      padding: 18px 12px 18px 18px;
      border-right: 1px solid #0a2a40;
      z-index: 2;
    }
    .sf-hud-right {
      grid-column: 3; grid-row: 2;
      display: flex; flex-direction: column; gap: 14px;
      padding: 18px 18px 18px 12px;
      border-left: 1px solid #0a2a40;
      z-index: 2;
    }
    .sf-hud-block { display: flex; flex-direction: column; gap: 6px; }
    .sf-hud-label {
      font-size: 7px; letter-spacing: .22em; color: #0e3a58; text-transform: uppercase;
    }
    .sf-hud-val {
      font-family: 'Orbitron', monospace;
      font-size: 12px; color: #1a6aaa; letter-spacing: .1em;
    }
    .sf-hud-bar-wrap {
      height: 3px; background: #050e18; border-radius: 1px; overflow: hidden;
    }
    .sf-hud-bar {
      height: 100%; border-radius: 1px; background: #1a4a8a;
      transition: width .6s ease, background .4s;
    }
    .sf-hud-divider { height: 1px; background: #0a2a40; }
    .sf-hud-vbar-wrap {
      display: flex; align-items: flex-end; gap: 2px; height: 30px;
    }
    .sf-hud-vbar {
      width: 8px; background: #0a2838; border-radius: 1px;
      transition: height .12s ease, background .4s;
    }

    /* Center canvas */
    .sf-center {
      grid-column: 2; grid-row: 2;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; position: relative;
    }
    canvas { display: block; }

    /* Footer */
    .sf-footer {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      padding: 10px 22px 16px;
      border-top: 1px solid #0a2a40;
      z-index: 2;
    }
    .sf-state-row {
      display: flex; align-items: center; gap: 16px;
    }
    .sf-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #3ab8ff; animation: sfblk 2s ease-in-out infinite;
    }
    @keyframes sfblk { 0%, 100% { opacity: 1; } 50% { opacity: .08; } }
    .sf-label {
      font-family: 'Orbitron', monospace;
      font-size: 9px; letter-spacing: .32em; color: #1e5a88;
      text-transform: uppercase; min-width: 120px;
    }
    .sf-ws {
      font-size: 7px; letter-spacing: .16em; text-transform: uppercase;
      padding: 2px 10px; border: 1px solid #0a2a44;
      color: #0e3a58; border-radius: 1px;
      transition: all .4s;
    }
    .sf-ws.connected { color: #3ab8ff; border-color: #1a4a8a; }
    .sf-ws.error     { color: #aa3030; border-color: #441010; }

    /* Audio visualizer */
    .sf-audio {
      display: flex; align-items: flex-end; gap: 2px;
      height: 24px; opacity: 0; transition: opacity .5s;
    }
    .sf-audio.active { opacity: 1; }
    .sf-audio-bar {
      width: 3px; background: #1a6aaa; border-radius: 1px;
      transition: height .08s ease;
    }

    .sf-hud-line {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, #1a4a8a44, #3ab8ff22, #1a4a8a44, transparent);
    }
    .sf-readout {
      font-size: 9px; color: #1a4a6a; letter-spacing: .12em;
      text-align: center; max-width: 480px; line-height: 1.8;
      min-height: 14px; transition: color .5s;
    }

    /* Debug buttons — shown only when WS disconnected */
    .sf-debug {
      display: none; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .sf-debug.visible { display: flex; }
    .sf-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px; letter-spacing: .16em; text-transform: uppercase;
      padding: 5px 14px; background: transparent;
      border: 1px solid #0a2a44; color: #1a6aaa;
      cursor: pointer; border-radius: 1px; transition: all .2s;
    }
    .sf-btn:hover { border-color: #3ab8ff; color: #80c8ff; background: #3ab8ff08; }
  </style>
</head>
<body>

<div class="sf-root" id="sfRoot">
  <div class="sf-scanline"></div>
  <div class="sf-corners">
    <span class="tl"></span><span class="tr"></span>
    <span class="bl"></span><span class="br"></span>
  </div>

  <!-- Header -->
  <div class="sf-header">
    <div>
      <div class="sf-clock-time" id="sfTime">00:00:00</div>
      <div class="sf-clock-date" id="sfDate">—</div>
    </div>
    <div class="sf-title-block">
      <div class="sf-title">Sexta-Feira</div>
      <div class="sf-subtitle">sistema de ia pessoal · v2.0</div>
    </div>
    <div>
      <div class="sf-sys-row">núcleo &nbsp;<span class="sf-sys-val">ollama</span></div>
      <div class="sf-sys-row">memória &nbsp;<span class="sf-sys-val">ativa</span></div>
      <div class="sf-sys-row">visão &nbsp;<span class="sf-sys-val">llava:7b</span></div>
    </div>
  </div>

  <!-- HUD Esquerdo -->
  <div class="sf-hud-left">
    <div class="sf-hud-block">
      <div class="sf-hud-label">energia</div>
      <div class="sf-hud-val" id="hudEnergy">0.00</div>
      <div class="sf-hud-bar-wrap"><div class="sf-hud-bar" id="hudEnergyBar" style="width:0%"></div></div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">sinapses</div>
      <div class="sf-hud-val" id="hudSynapses">00</div>
      <div class="sf-hud-bar-wrap"><div class="sf-hud-bar" id="hudSynBar" style="width:0%"></div></div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">streams</div>
      <div class="sf-hud-val" id="hudStreams">00</div>
      <div class="sf-hud-bar-wrap"><div class="sf-hud-bar" id="hudStBar" style="width:0%"></div></div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">freq. orbital</div>
      <div class="sf-hud-vbar-wrap" id="hudVbars">
        <div class="sf-hud-vbar" style="height:8px"></div>
        <div class="sf-hud-vbar" style="height:12px"></div>
        <div class="sf-hud-vbar" style="height:16px"></div>
        <div class="sf-hud-vbar" style="height:10px"></div>
        <div class="sf-hud-vbar" style="height:14px"></div>
        <div class="sf-hud-vbar" style="height:18px"></div>
        <div class="sf-hud-vbar" style="height:11px"></div>
      </div>
    </div>
  </div>

  <!-- Canvas central -->
  <div class="sf-center">
    <canvas id="sfCanvas" width="560" height="560"></canvas>
  </div>

  <!-- HUD Direito -->
  <div class="sf-hud-right">
    <div class="sf-hud-block">
      <div class="sf-hud-label">estado</div>
      <div class="sf-hud-val" id="hudState">idle</div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">uptime</div>
      <div class="sf-hud-val" id="hudUptime">00:00</div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">comandos</div>
      <div class="sf-hud-val" id="hudCmds">000</div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">núcleo temp</div>
      <div class="sf-hud-val" id="hudTemp">36.6°</div>
      <div class="sf-hud-bar-wrap"><div class="sf-hud-bar" id="hudTempBar" style="width:36%"></div></div>
    </div>
    <div class="sf-hud-divider"></div>
    <div class="sf-hud-block">
      <div class="sf-hud-label">lat. resposta</div>
      <div class="sf-hud-val" id="hudLat">—ms</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="sf-footer">
    <div class="sf-state-row">
      <div class="sf-dot"></div>
      <div class="sf-label" id="sfLabel">standby</div>
      <div class="sf-audio" id="sfAudio">
        <div class="sf-audio-bar" id="b0" style="height:3px"></div>
        <div class="sf-audio-bar" id="b1" style="height:6px"></div>
        <div class="sf-audio-bar" id="b2" style="height:10px"></div>
        <div class="sf-audio-bar" id="b3" style="height:16px"></div>
        <div class="sf-audio-bar" id="b4" style="height:20px"></div>
        <div class="sf-audio-bar" id="b5" style="height:16px"></div>
        <div class="sf-audio-bar" id="b6" style="height:10px"></div>
        <div class="sf-audio-bar" id="b7" style="height:6px"></div>
        <div class="sf-audio-bar" id="b8" style="height:3px"></div>
      </div>
      <span class="sf-ws" id="sfWs">desconectado</span>
    </div>
    <div class="sf-hud-line"></div>
    <div class="sf-readout" id="sfReadout">sistema online — aguardando ativação</div>
    <div class="sf-debug" id="sfDebug">
      <button class="sf-btn" onclick="setState('idle')">standby</button>
      <button class="sf-btn" onclick="setState('listen')">escutar</button>
      <button class="sf-btn" onclick="setState('think')">processar</button>
      <button class="sf-btn" onclick="setState('speak')">responder</button>
    </div>
  </div>
</div>

<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const cv = document.getElementById('sfCanvas');
const cx = cv.getContext('2d');
const W = 560, H = 560, MX = W / 2, MY = H / 2;
let t = 0, energy = 0, targetEnergy = 0, state = 'idle';
let cmdCount = 0, startTime = Date.now();

// ─── Anéis orbitais ───────────────────────────────────────────────────────────
const RINGS = [
  { r: 65,  tilt:  .22, speed:  .007,  phase: 0,    w: .6,  dash: [8, 12],  opacity: .38 },
  { r: 88,  tilt: -.38, speed: -.005,  phase: 1.05, w: .5,  dash: [4, 8],   opacity: .34 },
  { r: 110, tilt:  .55, speed:  .004,  phase: 2.1,  w: .45, dash: [16, 8],  opacity: .30 },
  { r: 130, tilt: -.7,  speed: -.003,  phase: .55,  w: .4,  dash: [6, 14],  opacity: .26 },
  { r: 150, tilt:  .85, speed:  .0025, phase: 3.2,  w: .36, dash: [20, 10], opacity: .22 },
  { r: 168, tilt: -.25, speed: -.002,  phase: 1.7,  w: .30, dash: [3, 10],  opacity: .18 },
  { r: 184, tilt:  .45, speed:  .0018, phase: 4.1,  w: .26, dash: [12, 18], opacity: .14 },
];

// ─── Grade esférica ───────────────────────────────────────────────────────────
const GLOBE_DOTS = [];
for (let lat = -80; lat <= 80; lat += 16) {
  const rLat = lat * Math.PI / 180;
  const count = Math.max(4, Math.floor(Math.cos(rLat) * 24));
  for (let i = 0; i < count; i++) {
    GLOBE_DOTS.push({ lat: rLat, lon: (i / count) * Math.PI * 2, phase: Math.random() * Math.PI * 2 });
  }
}
const GLOBE_R = 200, MERIDIANS = 12, PARALLELS = 8;
let synapses = [], sparks = [], streams = [];

// ─── Spawn ────────────────────────────────────────────────────────────────────
function spawnSynapse() {
  const ri1 = Math.floor(Math.random() * RINGS.length);
  const ri2 = Math.floor(Math.random() * RINGS.length);
  const angle = Math.random() * Math.PI * 2;
  const destAngle = angle + (Math.random() - .5) * 2.2;
  const life = 35 + Math.random() * 35;
  synapses.push({
    ox: MX + Math.cos(angle) * RINGS[ri1].r, oy: MY + Math.sin(angle) * RINGS[ri1].r,
    tx: MX + Math.cos(destAngle) * RINGS[ri2].r, ty: MY + Math.sin(destAngle) * RINGS[ri2].r,
    life, ml: life, progress: 0, bright: Math.random() > .6
  });
}
function spawnSpark(x, y) {
  for (let i = 0; i < 2; i++) {
    const a = Math.random() * Math.PI * 2, spd = .3 + Math.random() * .6, life = 12 + Math.random() * 10;
    sparks.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life, ml: life, size: .5 + Math.random() * .7 });
  }
}
function spawnStream() {
  const ri = Math.floor(Math.random() * RINGS.length);
  streams.push({ ring: ri, phase: Math.random() * Math.PI * 2, speed: (.007 + Math.random() * .01) * (Math.random() > .5 ? 1 : -1), life: 70 + Math.random() * 60, ml: 0, len: .25 + Math.random() * .4 });
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function drawGlobe() {
  cx.strokeStyle = `rgba(20,90,200,${.055 + energy * .065})`; cx.lineWidth = .32;
  for (let m = 0; m < MERIDIANS; m++) {
    const lon = (m / MERIDIANS) * Math.PI * 2 + t * .0008;
    cx.beginPath(); let first = true;
    for (let ang = -Math.PI / 2; ang <= Math.PI / 2; ang += .08) {
      const cl = Math.cos(ang), x3 = GLOBE_R * cl * Math.cos(lon), y3 = GLOBE_R * Math.sin(ang), z3 = GLOBE_R * cl * Math.sin(lon);
      if (z3 > 0) { if (first) { cx.moveTo(MX + x3, MY + y3); first = false; } else cx.lineTo(MX + x3, MY + y3); } else first = true;
    }
    cx.stroke();
  }
  for (let p = 1; p < PARALLELS; p++) {
    const lat = (-Math.PI / 2) + (p / PARALLELS) * Math.PI, rr = GLOBE_R * Math.cos(lat), yy = MY + GLOBE_R * Math.sin(lat);
    cx.beginPath(); cx.ellipse(MX, yy, rr, rr * .18, 0, 0, Math.PI * 2); cx.stroke();
  }
}
function drawGlobeDots() {
  for (const d of GLOBE_DOTS) {
    const lon = d.lon + t * .0012, x3 = GLOBE_R * Math.cos(d.lat) * Math.cos(lon), z3 = GLOBE_R * Math.cos(d.lat) * Math.sin(lon);
    if (z3 < 0) continue;
    const pulse = Math.sin(t * .04 + d.phase) * .5 + .5;
    cx.beginPath(); cx.arc(MX + x3, MY + GLOBE_R * Math.sin(d.lat), .7 + pulse * .4, 0, Math.PI * 2);
    cx.fillStyle = `rgba(50,130,255,${.08 + pulse * .16 + energy * .12})`; cx.fill();
  }
}
function drawRings() {
  for (const ring of RINGS) {
    cx.save(); cx.translate(MX, MY); cx.rotate(ring.phase * .08); cx.scale(1, Math.sin(ring.tilt));
    cx.beginPath(); cx.arc(0, 0, ring.r, 0, Math.PI * 2); cx.setLineDash(ring.dash);
    cx.lineDashOffset = -t * ring.speed * 180;
    cx.strokeStyle = `rgba(40,110,230,${ring.opacity + energy * .26})`;
    cx.lineWidth = ring.w + energy * 1.0; cx.stroke(); cx.setLineDash([]); cx.restore();
  }
}
function drawStreams() {
  for (const s of streams) {
    const ring = RINGS[s.ring]; cx.save(); cx.translate(MX, MY); cx.rotate(ring.phase * .08); cx.scale(1, Math.sin(ring.tilt));
    const alpha = Math.sin((s.life / s.ml) * Math.PI) * (.4 + energy * .28);
    cx.beginPath(); cx.arc(0, 0, ring.r, s.phase, s.phase + s.len * (s.speed > 0 ? 1 : -1), s.speed < 0);
    cx.strokeStyle = `rgba(90,180,255,${alpha})`; cx.lineWidth = .9 + energy * .7; cx.stroke(); cx.restore();
    s.phase += s.speed * (1 + energy * .5);
  }
}
function drawSynapses() {
  for (const s of synapses) {
    s.progress = 1 - (s.life / s.ml); const p = s.progress;
    const endX = s.ox + (s.tx - s.ox) * p, endY = s.oy + (s.ty - s.oy) * p;
    const alpha = Math.sin(p * Math.PI) * (.5 + energy * .18);
    cx.beginPath(); cx.moveTo(s.ox, s.oy); cx.lineTo(endX, endY);
    cx.strokeStyle = s.bright ? `rgba(150,210,255,${alpha})` : `rgba(40,120,230,${alpha})`;
    cx.lineWidth = s.bright ? .75 : .5; cx.stroke();
    cx.beginPath(); cx.arc(endX, endY, s.bright ? 1.3 : .85, 0, Math.PI * 2);
    cx.fillStyle = `rgba(170,225,255,${alpha})`; cx.fill();
    if (p > .92 && s.life === Math.floor(s.ml * .08)) spawnSpark(endX, endY);
  }
}
function drawSparks() {
  for (const s of sparks) {
    cx.beginPath(); cx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    cx.fillStyle = `rgba(130,205,255,${(s.life / s.ml) * .65})`; cx.fill();
  }
}
function drawCore() {
  const pulse = 1 + Math.sin(t * .05) * (.03 + energy * .07), R = 16 * pulse;
  for (let i = 2; i > 0; i--) {
    cx.beginPath(); cx.arc(MX, MY, R + i * 9 + energy * 3, 0, Math.PI * 2);
    cx.fillStyle = `rgba(20,80,190,${.022 * i + energy * .013})`; cx.fill();
  }
  cx.beginPath(); cx.arc(MX, MY, R + 3, 0, Math.PI * 2);
  cx.strokeStyle = `rgba(50,130,255,${.2 + energy * .28})`; cx.lineWidth = .5; cx.stroke();
  const hexR = R + 7; cx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + t * .008;
    i === 0 ? cx.moveTo(MX + Math.cos(a) * hexR, MY + Math.sin(a) * hexR) : cx.lineTo(MX + Math.cos(a) * hexR, MY + Math.sin(a) * hexR);
  }
  cx.closePath(); cx.strokeStyle = `rgba(60,150,255,${.12 + energy * .2})`; cx.lineWidth = .5; cx.stroke();
  const g = cx.createRadialGradient(MX - 2, MY - 2, 1, MX, MY, R);
  g.addColorStop(0, '#b0d8ff'); g.addColorStop(.4, '#2a80ff'); g.addColorStop(.8, '#083ab0'); g.addColorStop(1, '#030c28');
  cx.beginPath(); cx.arc(MX, MY, R, 0, Math.PI * 2); cx.fillStyle = g; cx.fill();
  cx.strokeStyle = `rgba(150,205,255,${.28 + energy * .28})`; cx.lineWidth = .35;
  cx.beginPath(); cx.moveTo(MX - R * .4, MY); cx.lineTo(MX + R * .4, MY); cx.moveTo(MX, MY - R * .4); cx.lineTo(MX, MY + R * .4); cx.stroke();
}
function drawTick() {
  const tickR = GLOBE_R + 12, ticks = 36;
  for (let i = 0; i < ticks; i++) {
    const a = (i / ticks) * Math.PI * 2, long = i % 9 === 0, len = long ? 7 : i % 3 === 0 ? 4 : 2;
    const x1 = MX + Math.cos(a) * tickR, y1 = MY + Math.sin(a) * tickR;
    const x2 = MX + Math.cos(a) * (tickR + len), y2 = MY + Math.sin(a) * (tickR + len);
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2);
    cx.strokeStyle = `rgba(30,100,200,${long ? .3 : .12})`; cx.lineWidth = long ? .65 : .3; cx.stroke();
  }
}
function drawHUDCorners() {
  const cr = 10, cl = `rgba(30,100,200,${.2 + energy * .18})`;
  [[MX - 200, MY - 195, 1, 1], [MX + 200, MY - 195, -1, 1], [MX - 200, MY + 195, 1, -1], [MX + 200, MY + 195, -1, -1]].forEach(([x, y, sx, sy]) => {
    cx.strokeStyle = cl; cx.lineWidth = .6; cx.beginPath(); cx.moveTo(x + sx * cr, y); cx.lineTo(x, y); cx.lineTo(x, y + sy * cr); cx.stroke();
  });
}

// ─── HUD update ───────────────────────────────────────────────────────────────
function updateHUD() {
  const e = energy;
  const eEl = document.getElementById('hudEnergy'); if (eEl) eEl.textContent = e.toFixed(2);
  const eb = document.getElementById('hudEnergyBar'); if (eb) { eb.style.width = Math.round(e * 100) + '%'; eb.style.background = e > .7 ? '#3ab8ff' : e > .3 ? '#1a6aaa' : '#0e3a58'; }
  const sc = synapses.length, sb = document.getElementById('hudSynapses'); if (sb) sb.textContent = String(sc).padStart(2, '0');
  const sbar = document.getElementById('hudSynBar'); if (sbar) sbar.style.width = Math.min(100, Math.round(sc / 20 * 100)) + '%';
  const stc = streams.length, stEl = document.getElementById('hudStreams'); if (stEl) stEl.textContent = String(stc).padStart(2, '0');
  const stbar = document.getElementById('hudStBar'); if (stbar) stbar.style.width = Math.min(100, Math.round(stc / 10 * 100)) + '%';
  document.querySelectorAll('.sf-hud-vbar').forEach((b, i) => {
    const h = Math.max(2, Math.round(8 + Math.sin(t * .05 + i) * (6 + e * 10)));
    b.style.height = h + 'px'; b.style.background = e > .5 ? '#1a6aaa' : '#0a2838';
  });
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mm = Math.floor(elapsed / 60), ss = elapsed % 60;
  const up = document.getElementById('hudUptime'); if (up) up.textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  const tmp = document.getElementById('hudTemp'); if (tmp) tmp.textContent = (36.6 + e * 8).toFixed(1) + '°';
  const tb = document.getElementById('hudTempBar'); if (tb) { const pct = Math.round(36 + e * 40); tb.style.width = pct + '%'; tb.style.background = e > .7 ? '#3ab8ff' : e > .3 ? '#1a6aaa' : '#0a2838'; }
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function update() {
  t++; energy += (targetEnergy - energy) * .045;
  for (const ring of RINGS) ring.phase += ring.speed * (1 + energy * .7);
  const sRate = state === 'speak' ? .36 : state === 'think' ? .14 : state === 'listen' ? .05 : .01;
  if (Math.random() < sRate) spawnSynapse();
  const stRate = state === 'speak' ? .11 : state === 'think' ? .055 : state === 'listen' ? .022 : .004;
  if (Math.random() < stRate) spawnStream();
  for (const s of synapses) { s.ml = s.ml || s.life; s.life--; }
  synapses = synapses.filter(s => s.life > 0);
  for (const s of streams) { s.ml = s.ml || s.life; s.life--; }
  streams = streams.filter(s => s.life > 0);
  for (const s of sparks) { s.ml = s.ml || s.life; s.x += s.vx; s.y += s.vy; s.vx *= .88; s.vy *= .88; s.life--; }
  sparks = sparks.filter(s => s.life > 0);
  if (t % 3 === 0) updateHUD();
}
function render() {
  cx.clearRect(0, 0, W, H);
  drawGlobe(); drawGlobeDots(); drawTick(); drawRings(); drawStreams(); drawSynapses(); drawSparks(); drawHUDCorners(); drawCore();
  update(); requestAnimationFrame(render);
}

// ─── State machine ─────────────────────────────────────────────────────────────
const STATE_MAP = {
  idle:    { energy: 0,   label: 'standby',       text: 'sistema online — aguardando ativação' },
  standby: { energy: 0,   label: 'standby',       text: 'sistema online — aguardando ativação' },
  listen:  { energy: .28, label: 'escutando...',  text: 'microfone ativo — detectando wake word...' },
  think:   { energy: .6,  label: 'processando...', text: 'consultando segundo cérebro — analisando contexto...' },
  speak:   { energy: 1,   label: 'respondendo',   text: 'sintetizando resposta — transmitindo...' },
  erro:    { energy: .1,  label: 'erro',          text: 'falha no processamento — aguardando novo comando.' },
};

let audioTimer = null;
const peakH = [3, 6, 10, 16, 20, 16, 10, 6, 3];

function animateAudio(active) {
  const el = document.getElementById('sfAudio');
  el.classList.toggle('active', active);
  if (audioTimer) clearInterval(audioTimer);
  if (!active) { peakH.forEach((h, i) => { const b = document.getElementById('b' + i); if (b) b.style.height = h + 'px'; }); return; }
  audioTimer = setInterval(() => {
    peakH.forEach((h, i) => {
      const b = document.getElementById('b' + i); if (!b) return;
      const nh = Math.max(2, Math.round(h * (Math.random() * .8 + .2) * (1 + energy * .6)));
      b.style.height = nh + 'px';
      b.style.background = energy > .7 ? '#3ab8ff' : energy > .3 ? '#1a6aaa' : '#0e3a58';
    });
  }, 80);
}

function setState(s, customText) {
  state = s;
  const cfg = STATE_MAP[s] || STATE_MAP.idle;
  targetEnergy = cfg.energy;
  const lbl = document.getElementById('sfLabel'); if (lbl) lbl.textContent = cfg.label;
  const rd = document.getElementById('sfReadout'); if (rd) rd.textContent = customText || cfg.text;
  const hs = document.getElementById('hudState'); if (hs) hs.textContent = s;
  animateAudio(s === 'speak');
  if (s === 'speak' || s === 'think') cmdCount++;
  const hc = document.getElementById('hudCmds'); if (hc) hc.textContent = String(cmdCount).padStart(3, '0');
  const hl = document.getElementById('hudLat');
  if (hl) hl.textContent = s === 'think' ? Math.round(200 + Math.random() * 800) + 'ms' : '—ms';
}

// ─── Relógio ──────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const sec = String(now.getSeconds()).padStart(2, '0');
  const te = document.getElementById('sfTime'); if (te) te.textContent = `${h}:${m}:${sec}`;
  const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const de = document.getElementById('sfDate');
  if (de) de.textContent = `${dias[now.getDay()]} · ${String(now.getDate()).padStart(2, '0')} ${meses[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ─── WebSocket ─────────────────────────────────────────────────────────────────
const WS_URL = 'ws://localhost:5005';
const wsEl = document.getElementById('sfWs');
let ws, wsRetryTimer;

function connectWS() {
  try { ws = new WebSocket(WS_URL); } catch (e) { document.getElementById('sfDebug').classList.add('visible'); return; }
  ws.onopen = () => {
    wsEl.textContent = 'conectado'; wsEl.className = 'sf-ws connected';
    clearTimeout(wsRetryTimer);
    document.getElementById('sfDebug').classList.remove('visible');
    setState('idle');
  };
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      const estado = data.estado || 'idle';
      const payload = data.payload || {};
      const texto = payload.dados_para_projetar?.conteudo || data.texto || null;
      setState(estado, texto);
    } catch (e) { console.warn('WS msg inválida:', event.data); }
  };
  ws.onclose = () => {
    wsEl.textContent = 'desconectado'; wsEl.className = 'sf-ws';
    setState('idle', 'conexão perdida — tentando reconectar...');
    wsRetryTimer = setTimeout(connectWS, 3000);
    document.getElementById('sfDebug').classList.add('visible');
  };
  ws.onerror = () => {
    wsEl.textContent = 'erro ws'; wsEl.className = 'sf-ws error';
    document.getElementById('sfDebug').classList.add('visible');
  };
}

render();
connectWS();
</script>
